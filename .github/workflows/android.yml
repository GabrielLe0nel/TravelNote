name: Build and Generate APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Habilita um botão para você rodar a action manualmente quando quiser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar o repositório
        uses: actions/checkout@v4
      - name: ☕ Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Se seu projeto for mais antigo, mude para '11'
          distribution: 'temurin'
          cache: gradle
      - name: 🔐 Dar permissão de execução ao Gradle
        run: chmod +x ./gradlew
      - name: ⚙️ Gerar o APK (Modo Debug)
        run: ./gradlew assembleDebug
      - name: 🚀 Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: TravelNote-APK
          # Os asteriscos garantem que a action vai capturar o APK independentemente da pasta exata
          path: app/build/outputs/apk/**/*.apk